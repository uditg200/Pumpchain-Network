services:
  - type: web
    name: pumpchain-backend
    runtime: node
    region: oregon
    buildCommand: npm install && npm run build:shared && npm run build --workspace=backend
    startCommand: node backend/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: PORT
        value: "3001"
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: PUMPCHAIN_NETWORK_ID
        value: pumpchain-mainnet
      - key: PUMPCHAIN_CHAIN_NAME
        value: Pumpchain Network
      - key: PUMPCHAIN_NATIVE_SYMBOL
        value: PUMP
      - key: PUMPCHAIN_ENVIRONMENT
        value: mainnet
      - key: BRIDGE_WALLET_PRIVATE_KEY
        sync: false
